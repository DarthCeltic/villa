name: ARGUS portable validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - 'release/**'
      - 'ci/**'

permissions:
  contents: read

concurrency:
  group: argus-portable-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-portable:
    name: Public test kit (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.14']
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: runtime/requirements-portable-ci.txt

      - name: Install locked portable dependencies
        run: |
          python -m pip install -r runtime/requirements-portable-ci.txt
          python -m pip install --no-build-isolation --no-deps -e .
          python -m pip check

      - name: Verify the release manifest
        run: python tools/verify_manifest.py

      - name: Run the public test kit
        run: python scripts/run_portable_ci.py

      - name: Compile Python sources
        run: python -m compileall -q argus src evidence_gate

      - name: Verify checkout cleanliness
        run: |
          git diff --check
          test -z "$(git status --short)"

  ui-portable:
    name: UI build and unit tests (Node 22)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: argus/ui
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: argus/ui/package-lock.json

      - name: Install locked UI dependencies
        run: npm ci

      - name: Build production UI
        run: npm run build

      - name: Run UI unit tests
        run: npm run test:unit -- --run

      - name: Verify checkout cleanliness
        working-directory: .
        run: |
          git diff --check
          test -z "$(git status --short)"
