# Production UI front door. Everything the browser talks to lives on ONE origin here, so
# argus.service.bff's hardcoded ALLOWED_ORIGINS (an exact-match set, deliberately not a prefix
# or substring check) never needs editing: this container is published as the origin
# http://127.0.0.1:8792, which is already the second of its two entries.
#
# / (static)       -> the built React bundle
# /api/*, /ws/*    -> the observe service (read-only; a separate container, reached by
#                     docker-compose service name)
# /ui/*            -> the ui-transport (bff) process, running in THIS SAME container on
#                     loopback only, by that module's own hard requirement (argus/serve.py
#                     refuses any non-loopback bind for ui-transport with return code 2,
#                     because it is the one process holding the command-service bearer token).

worker_processes 1;
pid /var/run/nginx/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    # Bodies are small everywhere except one upload route. The read-only observe service takes no body at all, and the UI transport takes
    # 64 KiB of JSON; only the annotation attachment upload (20 MiB of file, base64-encoded) is allowed more, and only at its own location.
    client_max_body_size 64k;

    # DNS rebinding: a page on another name that resolves to 127.0.0.1 still sends its own Host. Only our own names are answered.
    map $host $argus_host_ok {
        default        0;
        "127.0.0.1"    1;
        "localhost"    1;
        "[::1]"        1;
    }

    # A page on another site can make a browser POST to 127.0.0.1 (no-cors); the browser labels it, and nothing here needs it, so it is refused before any body is read.
    map "$http_sec_fetch_site:$request_method" $argus_cross_site_write {
        default 0;
        "~^(cross-site|same-site):(POST|PUT|PATCH|DELETE)$" 1;
    }

    # writable by the non-root nginx user (see Dockerfile: chown'd to argus:argus)
    client_body_temp_path /var/lib/nginx/body;
    proxy_temp_path /var/lib/nginx/proxy;

    server {
        listen 8792;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        if ($argus_host_ok = 0) {
            return 421;
        }

        if ($argus_cross_site_write) {
            return 403;
        }

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header Referrer-Policy "no-referrer" always;

        location = /health {
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        location /api/ {
            client_max_body_size 1k;
            proxy_pass http://observe:8787;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /ws/ {
            client_max_body_size 1k;
            proxy_pass http://observe:8787;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        location = /ui/annotations/attachments {
            client_max_body_size 28m;
            proxy_pass http://127.0.0.1:8789;
            proxy_set_header Host $host;
            proxy_set_header Origin $http_origin;
            proxy_set_header Cookie $http_cookie;
            proxy_pass_request_headers on;
        }

        location /ui/ {
            proxy_pass http://127.0.0.1:8789;
            proxy_set_header Host $host;
            proxy_set_header Origin $http_origin;
            proxy_set_header Cookie $http_cookie;
            proxy_pass_request_headers on;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
